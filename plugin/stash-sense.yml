name: Stash Sense
description: ML-powered performer identification and library curation for Stash
version: 0.1.3-beta.11
url: https://github.com/carrotwaxr/stash-sense

ui:
  javascript:
    - stash-sense-core.js
    - stash-sense-review.js
    - stash-sense-recommendations.js
    - stash-sense-settings.js
    - stash-sense-operations.js
    - stash-sense.js
  css:
    - stash-sense.css

settings:
  sidecarUrl:
    displayName: Stash Sense API URL
    description: URL of the Stash Sense sidecar container (e.g., http://localhost:5000)
    type: STRING
  minConfidence:
    displayName: Minimum Confidence
    description: Minimum confidence threshold for matches (0-100, higher is stricter)
    type: STRING
  maxResults:
    displayName: Maximum Results
    description: Maximum number of matches to show per detected face
    type: STRING
  excludeTagIds:
    displayName: Never touch - tag IDs
    description: Comma-separated Stash tag IDs. Scenes with these tags (or child tags) are skipped by every curation tool. Easiest to edit in Stash Sense > Settings > Curation.
    type: STRING
  excludeGroupIds:
    displayName: Never touch - group IDs
    description: Comma-separated Stash group IDs (sub-groups included). Easiest to edit in Stash Sense > Settings > Curation.
    type: STRING
  excludeStudioIds:
    displayName: Never touch - studio IDs
    description: Comma-separated Stash studio IDs (child studios included). Easiest to edit in Stash Sense > Settings > Curation.
    type: STRING
  disfavoredVideoCodecs:
    displayName: Disfavored video codecs
    description: Comma-separated lowercase codec names (e.g. hevc). Tie-breakers when picking a keeper, and a file in a disfavored codec raises the quality "format" flag. Easiest to edit in Stash Sense > Settings > Curation.
    type: STRING
  disfavoredContainers:
    displayName: Disfavored containers
    description: Comma-separated lowercase container names (e.g. wmv). Tie-breakers when picking a keeper, and a file in a disfavored container raises the quality "format" flag. Easiest to edit in Stash Sense > Settings > Curation.
    type: STRING
  qualityReportOnly:
    displayName: Quality flags - report only
    description: When on (the default), quality flags are only reported on review cards and accepting one changes nothing. Turn off to let accepted cards add scenes to the groups below.
    type: BOOLEAN
  qualityGroupBroken:
    displayName: Quality flags - broken group ID
    description: One Stash group ID; accepted cards add the scene to it when report-only is off (broken or truncated files).
    type: STRING
  qualityGroupRip:
    displayName: Quality flags - rip group ID
    description: One Stash group ID; accepted cards add the scene to it when report-only is off (tube or leak rips).
    type: STRING
  qualityGroupBelowStudio:
    displayName: Quality flags - below studio group ID
    description: One Stash group ID; accepted cards add the scene to it when report-only is off (files below the studio's release quality).
    type: STRING
  qualityGroupFormat:
    displayName: Quality flags - format group ID
    description: One Stash group ID; accepted cards add the scene to it when report-only is off (files in a disfavored format).
    type: STRING
  qualityPeerPercentile:
    displayName: Quality flags - peer percentile
    description: A file whose detail falls below this percentile of its studio and year peers is flagged below studio (1-50, default 10).
    type: STRING

exec:
  - python
  - "{pluginDir}/stash_sense_backend.py"
interface: raw
